<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>॥ जय श्री कृष्ण ॥ Happy Janmashtami 2026</title>
  
  <!-- Google Fonts: Great Vibes, Cinzel Decorative & Noto Sans Devanagari -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Great+Vibes&family=Noto+Sans+Devanagari:wght@600;700&family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Ambient Particle and Starfield Canvas -->
  <canvas id="fxCanvas"></canvas>

  <!-- Cinematic Divine Darshan Intro Screen -->
  <div id="introOverlay" class="intro-overlay">
    <div class="intro-bg-glow"></div>
    <div class="intro-content">
      <div class="sacred-symbol-ring">
        <span class="sacred-om">ॐ</span>
      </div>
      <p class="intro-mantra">॥ ॐ नमो भगवते वासुदेवाय ॥</p>
      <h2 class="intro-subtitle">Divya Darshan • Janmashtami 2026</h2>
      <button id="enterDarshanBtn" class="enter-btn">
        <span>Touch for Darshan 🪷</span>
      </button>
      <p class="auto-enter-hint">Revealing Kanha Ji...</p>
    </div>
  </div>

  <!-- Background Wallpaper / Video Layer (Revealed after transition) -->
  <div class="media-container darshan-hidden" id="mediaContainer">
    <video id="bgVideo" autoplay loop muted playsinline poster="preview.jpg">
      <source src="krishna_animated.mp4" type="video/mp4" />
    </video>
    <!-- Fallback artwork image if video is not yet placed -->
    <div class="fallback-glow" id="fallbackGlow"></div>
  </div>

  <!-- Cinematic Vignette & Atmospheric Fog -->
  <div class="vignette"></div>
  <div class="divine-rays"></div>

  <!-- Hanging Temple Brass Bell (Interactive Mandir Ghanti) -->
  <div id="templeBellContainer" class="temple-bell-container" title="Click to Ring Temple Bell">
    <div class="bell-chain"></div>
    <div class="bell-body" id="bellBody">
      <div class="bell-cap"></div>
      <div class="bell-dome">
        <div class="bell-tongue"></div>
      </div>
      <div class="bell-rim"></div>
    </div>
    <div class="bell-glow" id="bellGlow"></div>
  </div>

  <!-- Sacred Aarti Thali (Interactive Puja Mode) -->
  <div id="aartiThali" class="aarti-thali darshan-hidden">
    <div class="thali-plate">
      <!-- Sacred Flowers on Thali -->
      <div class="thali-decorations">
        <span class="thali-flower tf1">🌼</span>
        <span class="thali-flower tf2">🌸</span>
        <span class="thali-flower tf3">🌼</span>
        <span class="thali-flower tf4">🌸</span>
        <span class="thali-kumkum"></span>
      </div>
      <!-- Panchmukhi Deepa (5-wick Aarti Diya) -->
      <div class="thali-diya">
        <div class="diya-stand"></div>
        <div class="wick-flame w1"><div class="fire-glow"></div></div>
        <div class="wick-flame w2"><div class="fire-glow"></div></div>
        <div class="wick-flame w3"><div class="fire-glow"></div></div>
        <div class="wick-flame w4"><div class="fire-glow"></div></div>
        <div class="wick-flame w5"><div class="fire-glow"></div></div>
      </div>
      <!-- Incense / Dhoop Smoke -->
      <div class="thali-dhoop">
        <div class="dhoop-stick"></div>
        <div class="incense-smoke"></div>
      </div>
    </div>
    <div class="aarti-badge">🪔 Doing Puja of Kanha Ji (Drag Thali)</div>
  </div>

  <!-- Flower Shower (Pushpa Vrishti) during Puja -->
  <div id="petalContainer" class="petal-container"></div>

  <!-- Main Web Overlay (Revealed after transition) -->
  <main class="ui-overlay darshan-hidden" id="uiOverlay">
    <!-- Header Section -->
    <header class="header">
      <h1 class="main-title">HAPPY JANMASHTAMI 2026</h1>
      <h2 class="sanskrit-title">॥ जय श्री कृष्ण ॥</h2>
      <div class="divine-divider">
        <span class="line"></span>
        <span class="om">ॐ</span>
        <span class="line"></span>
      </div>
    </header>

    <!-- Bottom Dock: Controls + Blessing Card -->
    <div class="bottom-dock">
      <section class="controls-bar">
        <!-- Mandir Bell Button -->
        <button id="bellBtn" class="glass-btn pulse-gold" title="Ring Temple Bell">
          <span class="icon">🔔</span>
          <span class="label">Ring Bell</span>
        </button>

        <!-- Aarti / Puja Button -->
        <button id="aartiBtn" class="glass-btn pulse" title="Perform Divine Aarti & Puja">
          <span class="icon">🪔</span>
          <span class="label">Aarti / Puja</span>
        </button>

        <!-- Bansuri Flute Button -->
        <button id="bansuriBtn" class="glass-btn" title="Toggle Bansuri Music">
          <span class="icon">♪</span>
          <span class="label">Play Bansuri</span>
        </button>

        <!-- Save Wallpaper Button -->
        <a id="downloadBtn" href="krishna_animated.mp4" download="krishna_janmashtami_9_16.mp4" class="glass-btn" title="Download 9:16 Video Wallpaper">
          <span class="icon">⬇</span>
          <span class="label">Wallpaper</span>
        </a>

        <!-- Fullscreen Button -->
        <button id="fullscreenBtn" class="glass-btn" title="Toggle Fullscreen">
          <span class="icon">⛶</span>
          <span class="label">Fullscreen</span>
        </button>
      </section>

      <!-- Bottom Sacred Blessing Card -->
      <footer class="blessing-card">
        <p class="blessing-quote">
          “May Lord Krishna bless you with happiness, peace, prosperity and success.”
        </p>
        <p class="blessing-sub">
          Happy Janmashtami 2026 <span>❀</span>
        </p>
      </footer>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
